<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RF-Drums dev</title>
<style>
  :root {
    --bg: #0b0f12; --panel: #141b21; --edge: #22303a;
    --text: #d7e3ea; --dim: #6b7f8c; --accent: #f3bc7c; --hot: #e06c50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; gap: 10px;
    padding: 10px; touch-action: manipulation; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 16px; color: var(--accent); font-weight: 600; margin-right: 4px; }
  #status { color: var(--dim); font-size: 11px; flex: 1; min-width: 120px; }
  #status.err { color: var(--hot); }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--edge);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:active { background: var(--edge); }
  #start { background: var(--accent); color: #14100a; font-weight: 700; border: 0; }

  /* selector de cuerpo */
  #bodies { display: flex; gap: 6px; overflow-x: auto; }
  .body {
    flex: 1; min-width: 70px; text-align: center; padding: 9px 4px;
    border: 1px solid var(--edge); border-radius: 10px; background: var(--panel);
    color: var(--dim); cursor: pointer; user-select: none; font-size: 13px;
  }
  .body.sel { color: #14100a; background: var(--accent); border-color: var(--accent); font-weight: 700; }

  /* pad a la izquierda (~18%), faders a la derecha */
  #main { flex: 1; display: flex; gap: 10px; min-height: 0; }
  #pad {
    flex: 0 0 18%; min-width: 84px; border-radius: 14px;
    border: 1px solid var(--edge);
    background: linear-gradient(180deg, #1a232b, #101820);
    position: relative; user-select: none; touch-action: none; overflow: hidden;
  }
  #pad .flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; transition: opacity 240ms ease-out; }
  #pad.hit .flash { opacity: 0.3; transition: none; }
  #pad .tag {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    color: var(--dim); font-size: 11px; pointer-events: none;
  }
  #pad .axis {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    color: var(--dim); font-size: 10px; pointer-events: none;
  }

  #faders {
    flex: 1; display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    padding: 10px 12px; overflow-y: auto; min-height: 0;
  }
  .fader { display: grid; grid-template-columns: 86px 1fr 64px; gap: 8px; align-items: center; }
  .fader .name { color: var(--dim); font-size: 12px; }
  .fader .value { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 26px; }

  #bottom { display: flex; gap: 8px; align-items: center; }
  #copy { background: var(--accent); color: #14100a; font-weight: 700; border: 0; flex: 0 0 auto; }
  #json {
    flex: 1; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    color: var(--dim); font: 10px/1.35 ui-monospace, monospace; padding: 6px 8px;
    white-space: nowrap; overflow-x: auto; min-height: 30px;
  }
</style>
</head>
<body>
<header>
  <h1>RF-Drums</h1>
  <span id="status">motor detenido</span>
  <button id="rebuild">⟳ rebuild</button>
  <button id="start">▶ audio</button>
</header>

<div id="bodies"></div>

<div id="main">
  <div id="pad">
    <div class="flash"></div>
    <div class="axis">arriba = fuerte</div>
    <div class="tag">golpear</div>
  </div>
  <div id="faders"></div>
</div>

<div id="bottom" style="flex-wrap:wrap">
  <div class="fader" style="flex:1;min-width:150px"><span class="name">Room</span>
    <input id="room-mix" type="range" min="0" max="1" step="0.005" value="0.3">
    <span class="value" id="room-mix-v">0.30</span></div>
  <div class="fader" style="flex:1;min-width:150px"><span class="name">Size</span>
    <input id="room-size" type="range" min="0" max="1" step="0.005" value="0.35">
    <span class="value" id="room-size-v">0.35</span></div>
  <button id="copy">⧉ copy parameters</button>
  <div id="json" style="flex-basis:100%">el JSON del cuerpo seleccionado aparece acá</div>
</div>

<script>
const SPEC_BASE = 16, SPEC_STRIDE = 16;
const BODIES = [
  { name: "Kick",    slug: "kick-20",   note: 36, drum: 0 },
  { name: "Snare*",  slug: "snare-14",  note: 38, drum: 1 },
  { name: "Floor",   slug: "floor-16",  note: 41, drum: 2 },
  { name: "Tom 13",  slug: "tom-13",    note: 45, drum: 3 },
  { name: "Tom 12",  slug: "tom-12",    note: 48, drum: 4 },
];
// Field order mirrors DrumSpec / the ABI field indices exactly. `seeds` are
// a DISPLAY fallback per body so the faders work before (or without) the
// engine's reply; once audio starts, untouched faders reconcile to what the
// engine reports — Rust stays the source of truth.
const FIELDS = [
  { key: "pitch_hz",         name: "Pitch",    min: 25,     max: 500,   log: true,  fmt: v => v.toFixed(1) + " Hz" },
  { key: "air_load",         name: "Air load", min: 0,      max: 5,     log: false, fmt: v => v.toFixed(2) },
  { key: "cavity_stiffness", name: "Cavity",   min: 0,      max: 2.5,   log: false, fmt: v => v.toFixed(2) },
  { key: "t60_s",            name: "T60",      min: 0.05,   max: 6,     log: true,  fmt: v => v.toFixed(2) + " s" },
  { key: "loss_slope",       name: "Loss slp", min: 1,      max: 3.5,   log: false, fmt: v => v.toFixed(2) },
  { key: "contact_s",        name: "Contact",  min: 0.0004, max: 0.02,  log: true,  fmt: v => (v * 1000).toFixed(2) + " ms" },
  { key: "strike_radius",    name: "Radius",   min: 0.02,   max: 0.98,  log: false, fmt: v => v.toFixed(2) },
  { key: "gain",             name: "Gain",     min: 0,      max: 4,     log: false, fmt: v => v.toFixed(2) },
  { key: "crack",            name: "Crack",    min: 0,      max: 4,     log: false, fmt: v => v.toFixed(2) },
  { key: "shell",            name: "Shell",    min: 0,      max: 4,     log: false, fmt: v => v.toFixed(2) },
  { key: "res_tune",         name: "Res head", min: 0.7,    max: 1.5,   log: false, fmt: v => "×" + v.toFixed(3) },
  { key: "port",             name: "Port",     min: 0,      max: 2,     log: false, fmt: v => v.toFixed(2) },
];
const SEEDS = [
  [55, 1.2, 0.9, 0.35, 1.6, 0.008, 0.10, 1.6, 1.2, 0.7, 0.90, 0.8],
  [180, 0.35, 0.55, 0.5, 1.2, 0.0018, 0.45, 1.0, 1.6, 0.8, 1.35, 0.0],
  [82, 0.6, 0.5, 1.3, 1.3, 0.0025, 0.4, 1.25, 1.0, 0.7, 0.94, 0.0],
  [110, 0.5, 0.5, 1.0, 1.3, 0.002, 0.4, 1.15, 1.0, 0.7, 0.95, 0.0],
  [140, 0.45, 0.5, 0.8, 1.3, 0.0018, 0.4, 1.1, 1.0, 0.7, 0.95, 0.0],
];

const statusEl = document.getElementById("status");
const jsonEl = document.getElementById("json");
let node = null, context = null;
let selected = 2; // floor tom, el primer instrumento del plan
const values = SEEDS.map((row) => row.slice());
const touched = BODIES.map(() => FIELDS.map(() => false));

function setStatus(text, err = false) {
  statusEl.textContent = text;
  statusEl.className = err ? "err" : "";
}
// Que ningún error muera en silencio: a la línea de estado.
window.addEventListener("error", (e) => setStatus(`error: ${e.message}`, true));
window.addEventListener("unhandledrejection", (e) =>
  setStatus(`error: ${e.reason}`, true));

// --- worklet ---
const pendingReads = new Map();
async function start() {
  if (context) return;
  context = new AudioContext({ latencyHint: "interactive" });
  const wasmBytes = await (await fetch("rf_drums.wasm", { cache: "no-store" })).arrayBuffer();
  // Cache-bust del módulo: los worklets se cachean con más ganas que el
  // resto y un worklet viejo deja la página entera muda de respuestas.
  await context.audioWorklet.addModule("worklet.js?v=" + Date.now());
  node = new AudioWorkletNode(context, "rf-drums", {
    numberOfInputs: 0,
    outputChannelCount: [2],
    processorOptions: { wasmBytes },
  });
  node.onprocessorerror = () => setStatus("el procesador de audio murió", true);
  node.port.onmessage = (event) => {
    const message = event.data;
    if (message.type === "values" && pendingReads.has(message.tag)) {
      pendingReads.get(message.tag)(message.values);
      pendingReads.delete(message.tag);
    }
  };
  node.connect(context.destination);
  await context.resume();
  setStatus(`sonando · ${context.sampleRate} Hz`);
  document.getElementById("start").style.display = "none";
  // Reenviar lo que el usuario ya movió antes de arrancar, y reconciliar lo
  // demás con los valores del motor (Rust manda).
  for (const body of BODIES) {
    const base = SPEC_BASE + body.drum * SPEC_STRIDE;
    FIELDS.forEach((_, field) => {
      if (touched[body.drum][field]) {
        node.port.postMessage({
          type: "param", index: base + field, value: values[body.drum][field],
        });
      }
    });
    const indices = FIELDS.map((_, field) => base + field);
    const tag = `seed-${body.drum}`;
    node.port.postMessage({ type: "read", indices, tag });
    pendingReads.set(tag, (read) => {
      read.forEach((value, field) => {
        if (!touched[body.drum][field] && Number.isFinite(value)) {
          values[body.drum][field] = value;
        }
      });
      if (body.drum === selected) renderFaders();
    });
  }
  node.port.postMessage({ type: "param", index: 4, value: room.mix });
  node.port.postMessage({ type: "param", index: 5, value: room.size });
}

function hit(velocity) {
  if (!node) return;
  node.port.postMessage({
    type: "midi",
    data: [0x99, BODIES[selected].note, Math.max(1, Math.min(127, velocity | 0))],
  });
  const pad = document.getElementById("pad");
  pad.classList.add("hit");
  requestAnimationFrame(() => requestAnimationFrame(() => pad.classList.remove("hit")));
}

// --- selector ---
const bodiesEl = document.getElementById("bodies");
BODIES.forEach((body, index) => {
  const el = document.createElement("div");
  el.className = "body" + (index === selected ? " sel" : "");
  el.textContent = body.name;
  el.addEventListener("pointerdown", () => {
    selected = index;
    document.querySelectorAll(".body").forEach((b, i) => b.classList.toggle("sel", i === selected));
    renderFaders();
    updateJson();
  });
  body.el = el;
  bodiesEl.appendChild(el);
});

// --- pad ---
const padEl = document.getElementById("pad");
padEl.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const rect = padEl.getBoundingClientRect();
  const y = (event.clientY - rect.top) / rect.height;
  const velocity = 127 * (1 - 0.85 * y);
  padEl.querySelector(".tag").textContent = `vel ${velocity | 0}`;
  hit(velocity);
});
document.addEventListener("keydown", (event) => {
  if (event.repeat) return;
  if (event.key === " ") { event.preventDefault(); hit(110); }
  const index = Number(event.key) - 1;
  if (index >= 0 && index < BODIES.length) BODIES[index].el.dispatchEvent(new Event("pointerdown"));
});

// --- faders ---
const fadersEl = document.getElementById("faders");
const toSlider = (field, value) =>
  field.log
    ? Math.log(value / field.min) / Math.log(field.max / field.min)
    : (value - field.min) / (field.max - field.min);
const fromSlider = (field, t) =>
  field.log ? field.min * Math.pow(field.max / field.min, t) : field.min + t * (field.max - field.min);

function renderFaders() {
  fadersEl.innerHTML = "";
  const drumValues = values[selected];
  FIELDS.forEach((field, fieldIndex) => {
    const value = drumValues[fieldIndex];
    const el = document.createElement("div");
    el.className = "fader";
    el.innerHTML = `<span class="name">${field.name}</span>
      <input type="range" min="0" max="1" step="0.0005"
             value="${toSlider(field, value)}">
      <span class="value">${field.fmt(value)}</span>`;
    const input = el.querySelector("input");
    const valueEl = el.querySelector(".value");
    input.addEventListener("input", () => {
      const physical = fromSlider(field, Number(input.value));
      values[selected][fieldIndex] = physical;
      touched[selected][fieldIndex] = true;
      valueEl.textContent = field.fmt(physical);
      node?.port.postMessage({
        type: "param",
        index: SPEC_BASE + BODIES[selected].drum * SPEC_STRIDE + fieldIndex,
        value: physical,
      });
      updateJson();
    });
    fadersEl.appendChild(el);
  });
}
renderFaders();

// --- room (global params 4/5) ---
const room = { mix: 0.3, size: 0.35 };
for (const [id, key, index] of [["room-mix", "mix", 4], ["room-size", "size", 5]]) {
  const input = document.getElementById(id);
  const label = document.getElementById(id + "-v");
  input.addEventListener("input", () => {
    room[key] = Number(input.value);
    label.textContent = room[key].toFixed(2);
    node?.port.postMessage({ type: "param", index, value: room[key] });
    updateJson();
  });
}

// --- copy parameters ---
function currentJson() {
  const drumValues = values[selected];
  if (!drumValues || drumValues.some((v) => v == null)) return null;
  const spec = { drum: BODIES[selected].slug };
  FIELDS.forEach((field, index) => {
    spec[field.key] = Number(drumValues[index].toPrecision(5));
  });
  spec._room = { mix: room.mix, size: room.size };
  return JSON.stringify(spec);
}
function updateJson() {
  jsonEl.textContent = currentJson() ?? "arrancá el audio para leer los valores del motor";
}
document.getElementById("copy").addEventListener("click", async () => {
  const json = currentJson();
  if (!json) return setStatus("sin valores aún — arrancá el audio", true);
  updateJson();
  try {
    await navigator.clipboard.writeText(json);
    setStatus("parámetros copiados al portapapeles");
  } catch {
    // Clipboard puede fallar sin gesto confiable en Android; el JSON queda
    // visible abajo para seleccionarlo a mano.
    setStatus("clipboard bloqueado — copialo del recuadro", true);
  }
});

// --- rebuild ---
document.getElementById("rebuild").addEventListener("click", async () => {
  setStatus("compilando…");
  try {
    const result = await (await fetch("/build", { method: "POST" })).json();
    if (result.ok) { setStatus("compilado; recargando"); location.reload(); }
    else { setStatus("build falló — consola", true); console.error(result.output); }
  } catch (error) { setStatus(`build error: ${error}`, true); }
});

document.getElementById("start").addEventListener("click", () =>
  start().catch((error) => setStatus(`${error}`, true)));
updateJson();
</script>
</body>
</html>
